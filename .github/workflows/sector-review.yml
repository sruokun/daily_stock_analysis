name: A股板块复盘

on:
  schedule:
    - cron: '20 7 * * 1-5'   # 北京时间15:20
  workflow_dispatch:

concurrency:
  group: sector-review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行板块复盘
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python sector_review/main.py

      - name: 保存复盘历史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sector_review_history reports/sector_review
          if git diff --cached --quiet; then
            echo "没有新历史数据"
          else
            git commit -m "chore: save sector review history"
            git push
          fi
